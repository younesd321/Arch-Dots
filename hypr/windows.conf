##############################
### WINDOWS AND WORKSPACES ###
##############################

# Layer rules (لـ rofi و waybar)
layerrule = blur on, match:namespace ^(rofi)$
#layerrule = blur on, match:namespace ^(waybar)$

# Clipse rules
windowrule = float on, match:class ^(clipse)$
windowrule = size 622 652, match:class ^(clipse)$
windowrule = stay_focused on, match:class ^(clipse)$
windowrule = opacity 0.95 0.95 0.95, match:class ^(clipse)$

# Waypaper rules
windowrule = float on, match:class ^(waypaper)$
windowrule = opacity 0.90 0.90 0.90, match:class ^(waypaper)$

# Other opacity rules
windowrule = opacity 0.90 0.90 0.90, match:class ^(kitty)$
windowrule = opacity 0.90 0.90 0.90, match:class ^(Alacritty)$
windowrule = opacity 0.95 0.95 0.95, match:class ^(thunar)$
windowrule = opacity 0.95 0.95 0.95, match:class ^(obsidian)$
windowrule = opacity 0.95 0.95 0.95, match:class ^(org.telegram.desktop)$

# Ignore maximize requests from all apps
windowrule = suppress_event maximize, match:class .*

# Fix dragging issues with some XWayland windows
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false
